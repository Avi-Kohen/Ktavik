[project]
name = "ktavik"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ktavik-synth",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv.sources]
ktavik-synth = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/synth",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.mypy]
strict = true
files = ["packages"]

[tool.pytest.ini_options]
testpaths = ["packages"]
